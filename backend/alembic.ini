# Alembic configuration for the PostgreSQL schema (see app/db.py).
# The database URL comes from DATABASE_URL (app.config), never from this file.
#
#   cd backend
#   DATABASE_URL=postgresql://... alembic upgrade head
#   DATABASE_URL=postgresql://... alembic revision --autogenerate -m "add foo"

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
